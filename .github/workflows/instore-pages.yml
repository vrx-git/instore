# Builds the INSTORE iPhone web app and publishes it to GitHub Pages (free HTTPS hosting).
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: INSTORE to GitHub Pages

on:
  push:
    branches: [master, main]
    paths: ['instore/**', 'package-lock.json', '.github/workflows/instore-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: instore-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test -w instore
      - name: Build
        run: npm run build -w instore
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # Deep links (e.g. /items/3) on first visit: Pages serves 404.html, which is the app.
      - run: cp instore/dist/index.html instore/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: instore/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
